<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#13100e">
<meta name="description" content="증강을 고르며 겨루는 알까기. 1대1 온라인 대전을 지원합니다.">
<style>html,body{margin:0;background:#13100e}[hidden]{display:none!important}</style>
<script>
/* 웹 배포판 전용: claude.ai의 room 기능 대신 내 서버(server.js)의 WebSocket으로 같은 일을 합니다.
   게임 코드는 window.claude.use('room')만 부르므로, 여기서 같은 모양의 객체를 만들어 줍니다.
   presence(patch)  : 내 상태를 합쳐서 방 사람들에게 알림 (값이 null이면 그 키 삭제)
   onPeers(handler) : 방 사람 목록이 바뀔 때마다 handler({ peers }) 호출
   연결이 끊기면 자동으로 다시 붙고, 붙자마자 내 상태 전체를 다시 보냅니다. */
(() => {
  window.__ALK_WEB__ = true;
  const URL_WS = (location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws';
  const ABC = 'abcdefghijklmnopqrstuvwxyz0123456789';
  let peerId = null;
  try { peerId = sessionStorage.getItem('alk-peer'); } catch (e) {}
  if (!peerId || !/^[a-z0-9]{8,20}$/.test(peerId)) {
    peerId = Array.from({ length: 12 }, () => ABC[Math.floor(Math.random() * ABC.length)]).join('');
    try { sessionStorage.setItem('alk-peer', peerId); } catch (e) {}
  }
  let ws = null, open = false, backoff = 600, cur = null;
  const waiters = [];

  function connect() {
    try { ws = new WebSocket(URL_WS); } catch (e) { setTimeout(connect, backoff); return; }
    ws.onopen = () => {
      open = true; backoff = 600;
      if (cur) { cur._rejoin(); cur._conn(true); }
      while (waiters.length) waiters.shift()();
    };
    ws.onmessage = ev => {
      let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
      if (cur && m.room === cur.name) cur._msg(m);
    };
    ws.onclose = () => {
      open = false;
      if (cur) cur._conn(false);
      setTimeout(connect, backoff); backoff = Math.min(8000, backoff * 1.7);
    };
    ws.onerror = () => {};
  }
  connect(); // 페이지를 열자마자 연결해 두면, 잠든 서버도 그동안 깨어납니다
  // 방에 있는 동안은 4분마다 짧은 신호를 보내, 무료 서버가 대국 도중 잠들지 않게 합니다
  setInterval(() => { if (cur) send({ t: 'hb' }); }, 240000);

  const send = m => { if (open && ws && ws.readyState === 1) ws.send(JSON.stringify(m)); };
  const ready = ms => new Promise((res, rej) => {
    if (open) return res();
    const t = setTimeout(() => rej(Object.assign(new Error('중계소에 연결하지 못했습니다'), { code: 'timeout' })), ms);
    waiters.push(() => { clearTimeout(t); res(); });
  });

  function makeRoom(name) {
    const my = {}, handlers = new Set(), connH = new Set();
    let others = [], left = false, first = null;
    const snap = () => [{ peer: peerId, isMe: true, sameTab: true, kind: 'viewer', guest: false,
      presence: JSON.parse(JSON.stringify(my)), updatedAt: Date.now() }, ...others];
    const fire = () => { const peers = snap(); handlers.forEach(h => { try { h({ peers, joined: [], left: [], updated: [] }); } catch (e) { console.error(e); } }); };
    const room = {
      name,
      _first: new Promise((res, rej) => { first = { res, rej }; }),
      _rejoin() { if (!left) send({ t: 'join', room: name, peer: peerId, presence: my }); },
      _conn(v) { connH.forEach(h => { try { h(v); } catch (e) {} }); },
      _msg(m) {
        if (m.t === 'full') { if (first) { first.rej(Object.assign(new Error('방이 가득 찼습니다'), { code: 'not_permitted' })); first = null; } return; }
        if (m.t !== 'peers') return;
        others = m.peers.filter(p => p.peer !== peerId).map(p => ({ peer: p.peer, isMe: false, sameTab: false, kind: 'viewer', guest: false,
          presence: p.presence || {}, updatedAt: p.at, away: !!p.away }));
        if (first) { first.res(); first = null; }
        fire();
      },
      presence: async patch => {
        for (const k in patch) { if (patch[k] === null) delete my[k]; else my[k] = patch[k]; }
        send({ t: 'presence', room: name, patch });
        fire();
      },
      onPeers: h => { handlers.add(h); setTimeout(fire, 0); return () => handlers.delete(h); },
      peers: () => snap(),
      connected: () => open,
      onConnection: h => { connH.add(h); setTimeout(() => h(open), 0); return () => connH.delete(h); },
      emit: async () => {}, on: () => () => {},
      leave: async () => { left = true; send({ t: 'leave', room: name }); handlers.clear(); connH.clear(); if (cur === room) cur = null; }
    };
    return room;
  }

  const lobby = {
    join: async name => {
      await ready(75000);
      if (cur) await cur.leave();
      const room = makeRoom(String(name).toLowerCase());
      cur = room; room._rejoin();
      await Promise.race([room._first, new Promise((_, rej) => setTimeout(() => rej(Object.assign(new Error('응답이 없습니다'), { code: 'timeout' })), 15000))])
        .catch(e => { if (cur === room) cur = null; throw e; });
      return room;
    }
  };
  window.claude = { use: async n => (n === 'room' ? lobby : null) };
})();

</script>

<body>
<title>증강 알까기</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@500;600;700;900&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: 한 화면 게임. 왼쪽은 19줄 비자나무 판, 오른쪽은 대국 기록. 좁은 화면에서는 세로로 쌓인다.
   Single-theme by choice: 나전칠기 대국실 — 옻칠한 흑갈색 바탕, 금박 실선, 자개 빛, 인주 도장. */
:root{
  color-scheme: dark;
  --lacquer:#13100e;
  --lacquer-2:#1b1613;
  --lacquer-3:#251e1a;
  --lacquer-4:#30271f;
  --hair:rgba(201,164,92,.28);
  --hair-strong:rgba(201,164,92,.6);
  --gold:#c9a45c;
  --gold-hi:#e8cd8e;
  --gold-leaf:linear-gradient(135deg,#8a6a2c 0%,#e8cd8e 38%,#b88f45 62%,#f1dca6 100%);
  --ivory:#efe6d4;
  --muted:#a69a87;
  --faint:#7d7264;
  --inju:#b5402e;
  --silver:#c9ced6;
  --silver-leaf:linear-gradient(135deg,#7d838d 0%,#eef1f5 40%,#9aa1ab 64%,#f6f8fb 100%);
  --nacre:linear-gradient(120deg,#bfe3ea 0%,#d6c9f2 24%,#f2cfe0 48%,#f1e2bd 72%,#c7ebdd 100%);
  --teal:#7fc3c9;
  --scrim:rgba(10,8,7,.74);
  --shadow:rgba(0,0,0,.55);
  --stone-b:radial-gradient(circle at 34% 30%,#6b6f76 0%,#25272b 44%,#0b0b0d 100%);
  --stone-w:radial-gradient(circle at 34% 30%,#ffffff 0%,#efe9dc 55%,#bdb3a0 100%);
  --font-display:'Noto Serif KR','Nanum Myeongjo','AppleMyungjo','Batang',serif;
  --font-body:'IBM Plex Sans KR','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif;
  --font-seal:'Noto Serif KR','Nanum Myeongjo','Batang',serif;
}
html{height:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{
  min-height:100%;box-sizing:border-box;margin:0;
  background-color:var(--lacquer);
  background-image:radial-gradient(1200px 620px at 30% -10%,#2a211b 0%,transparent 64%),radial-gradient(900px 500px at 110% 110%,#1d1714 0%,transparent 60%);
  background-repeat:no-repeat;
  color:var(--ivory);font:15px/1.6 var(--font-body);
  word-break:keep-all;overflow-wrap:break-word;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 28px;
  display:flex;flex-direction:column;
}
body::before{content:"";position:fixed;left:0;right:0;bottom:0;height:42vh;pointer-events:none;z-index:-1;background:url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1600 360' preserveAspectRatio='none'><path fill='%23e8d9b8' fill-opacity='.035' d='M0 210 C120 150 190 90 280 120 S430 40 520 90 S700 170 790 110 S960 20 1060 80 S1260 160 1350 100 S1520 60 1600 120 V360 H0Z'/><path fill='%23e8d9b8' fill-opacity='.045' d='M0 270 C90 230 170 190 250 215 S390 150 470 195 S640 250 730 205 S880 160 980 200 S1150 260 1240 215 S1440 170 1600 225 V360 H0Z'/><path fill='%23c9a45c' fill-opacity='.05' d='M0 320 C140 295 260 270 380 290 S620 320 760 300 S1020 270 1160 295 S1420 320 1600 300 V360 H0Z'/></svg>") bottom/100% 100% no-repeat}
button,input{font:inherit;color:inherit}
:focus-visible{outline:1px solid var(--gold-hi);outline-offset:3px}

.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 26px;padding-block:18px 14px;max-width:1320px;width:100%;margin:0 auto;border-bottom:1px solid var(--hair)}
.brand{display:flex;align-items:center;gap:12px;font-family:var(--font-display);font-weight:700;font-size:21px;letter-spacing:.12em}
.scoreboard{display:flex;align-items:center;gap:14px;margin-right:auto;font-variant-numeric:tabular-nums;flex-wrap:nowrap;height:36px;min-width:0;overflow:hidden}
.scoreboard .meta{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.score-pair{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-weight:600;font-size:24px;line-height:36px}
.score-pair .colon{color:var(--faint)}
.meta{color:var(--muted);font-size:12.5px;letter-spacing:.04em}
.netchip{display:inline-flex;align-items:center;gap:7px;font-size:12px;letter-spacing:.06em;color:var(--muted);border:1px solid var(--hair);border-radius:2px;padding:3px 9px}
.netchip i{width:7px;height:7px;border-radius:50%;background:var(--faint);display:inline-block}
.netchip.on i{background:#8fd19e;box-shadow:0 0 8px #8fd19e}
.netchip.wait i{background:var(--gold)}
.bar-actions{display:flex;gap:8px}
.btn-ghost{background:transparent;border:1px solid var(--hair);border-radius:2px;padding:7px 14px;cursor:pointer;font-size:13px;letter-spacing:.08em;color:var(--ivory);transition:border-color .2s,color .2s}
.btn-ghost:hover{border-color:var(--gold);color:var(--gold-hi)}
.btn-ghost:disabled{opacity:.45;cursor:default}
.btn-primary{position:relative;background:var(--gold-leaf);color:#1c140a;border:0;border-radius:2px;padding:13px 26px;font-family:var(--font-display);font-weight:700;font-size:16px;letter-spacing:.14em;cursor:pointer;box-shadow:0 10px 26px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.45)}
.btn-primary:hover{filter:brightness(1.06)}
.btn-primary:active{transform:translateY(1px)}
.btn-primary:disabled{filter:grayscale(.7) brightness(.7);cursor:default}

.seal{display:inline-grid;place-items:center;background:var(--inju);color:#f6eee0;font-family:var(--font-seal);font-weight:900;border-radius:3px;box-shadow:inset 0 0 0 1.5px rgba(246,238,224,.35);line-height:1;transform:rotate(-3deg);flex:none}
.seal-sm{width:30px;height:30px;font-size:19px}
.seal-xs{width:24px;height:24px;font-size:15px;border-radius:2px}
.seal-lg{width:58px;height:58px;font-size:36px;border-radius:4px}

.stone-ico{position:relative;display:inline-block;width:16px;height:16px;border-radius:50%;flex:none;box-shadow:0 1px 3px var(--shadow)}
.stone-ico.b{background:var(--stone-b)}
.stone-ico.w{background:var(--stone-w)}
.stone-ico.lg{width:28px;height:28px}
.stone-ico.xl{width:44px;height:44px}
.pix{image-rendering:pixelated;image-rendering:crisp-edges;display:block}
.ava{--c:#c9a45c;position:relative;flex:none;width:48px;height:48px;border-radius:3px;overflow:visible;
  background:radial-gradient(circle at 50% 38%,color-mix(in srgb,var(--c) 55%,transparent),transparent 72%),linear-gradient(#2a221c,#16120f);
  box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--c) 60%,transparent)}
.ava>img{width:48px;height:48px;border-radius:3px}
.ava.sm{width:32px;height:32px}.ava.sm>img{width:32px;height:32px}
.ava>.stone-ico{position:absolute;right:-5px;bottom:-5px;width:16px;height:16px;box-shadow:0 0 0 2px #15110e}
.ava.bust{width:112px;height:112px}.ava.bust>img{width:112px;height:112px}
.stone-ico.da::after,.stone-ico.db::after{content:"";position:absolute;inset:33%;border-radius:50%;background:var(--gold)}
.stone-ico.db::after{background:var(--teal)}

.stage{display:grid;grid-template-columns:minmax(0,1fr) minmax(290px,350px);gap:26px;max-width:1320px;width:100%;margin:18px auto 0;align-items:start}
.table{min-width:0;display:flex;flex-direction:column;gap:10px}
/* 차례 줄은 글자 길이·글꼴이 바뀌어도 높이가 변하지 않게 고정: 판이 위아래로 밀리지 않습니다 */
.turn-strip{display:grid;grid-template-columns:auto auto minmax(0,1fr);grid-template-rows:30px 36px;column-gap:12px;align-items:center;height:66px;overflow:hidden;contain:layout}
.turn-strip>.ava{grid-row:1/3;grid-column:1}
.turn-strip:not(:has(.ava)){grid-template-columns:auto minmax(0,1fr)}
.turn-strip:not(:has(.ava))>.turn-name{grid-column:1}
.turn-strip:not(:has(.ava))>.turn-hint{grid-column:1/3}
.turn-name{grid-row:1;grid-column:2;font-family:var(--font-display);font-weight:600;font-size:21px;line-height:30px;letter-spacing:.04em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-width:0}
.turn-hint{grid-row:2;grid-column:2/4;align-self:start;color:var(--muted);font-size:13px;line-height:18px;max-height:36px;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:2;line-clamp:2}
.turn-hint.flash{color:var(--gold-hi)}
.alert{font-size:12.5px;padding:3px 10px;border-radius:2px;background:var(--inju);color:#f6eee0;letter-spacing:.04em}
.turn-strip>.alert{grid-row:1;grid-column:3;justify-self:start;max-width:100%;line-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.board-box{display:flex;justify-content:center;min-width:0}
#board{display:block;touch-action:none;cursor:grab;max-width:100%}
#board.dragging{cursor:grabbing}

.panel{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:linear-gradient(180deg,var(--lacquer-2),var(--lacquer));border:1px solid var(--hair);border-radius:4px;box-shadow:inset 0 1px 0 rgba(255,240,210,.04)}
.mapcard{display:flex;align-items:center;gap:12px;padding:12px 14px}
.mapcard b{font-family:var(--font-display);font-weight:600;font-size:16px;letter-spacing:.06em}
.mapcard small{display:block;color:var(--muted);font-size:12px}
.shrinkbar{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.shrinkbar b{display:block;font-size:15px}
.shrinkbar.on b{color:#e07a64}
#players{display:flex;flex-direction:column;gap:10px}
.pcard{padding:13px 15px;display:flex;flex-direction:column;gap:9px;position:relative}
.pcard.active{border-color:var(--hair-strong)}
.pcard.active::before{content:"";position:absolute;left:-1px;top:12px;bottom:12px;width:2px;background:var(--gold-leaf)}
.pcard-head{display:flex;align-items:center;gap:11px}
.pcard-who{display:flex;flex-direction:column;min-width:0;gap:1px}
.pcard-who small{color:var(--faint);font-size:11px;letter-spacing:.06em}
.pcard-name{font-family:var(--font-display);font-weight:600;font-size:17px;letter-spacing:.06em}
.chip{font-size:11px;letter-spacing:.08em;padding:1px 8px;border-radius:2px;border:1px solid var(--hair);color:var(--muted)}
.chip.turn{border-color:transparent;background:var(--gold-leaf);color:#1c140a}
.pcount{margin-left:auto;color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums}
.aug-list{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:7px}
.aug-list li{display:grid;grid-template-columns:24px minmax(0,1fr);column-gap:10px;align-items:center}
.aug-list .seal{grid-row:span 2}
.aug-list b{font-size:13.5px;font-weight:600}
.aug-list small{color:var(--muted);font-size:12px;line-height:1.35}
.empty{margin:0;color:var(--faint);font-size:12.5px}
.box-title{font-family:var(--font-display);font-size:13px;font-weight:600;letter-spacing:.2em;color:var(--gold);margin:0 0 10px}
.logbox{padding:13px 15px}
#log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:5px;font-size:12.5px}
#log li{display:flex;gap:8px;align-items:baseline;color:var(--muted)}
#log li:first-child{color:var(--ivory)}
#log .stone-ico{width:9px;height:9px;transform:translateY(1px)}
.rules{border-top:1px solid var(--hair);padding-top:12px}
.rules summary{cursor:pointer;font-family:var(--font-display);font-weight:600;color:var(--muted);letter-spacing:.14em;font-size:13px}
.rules ul{margin:10px 0 0;padding-left:18px;color:var(--muted);font-size:12.5px;display:grid;gap:5px}
.bal-note{margin:10px 0 0;color:var(--muted);font-size:12px}
.book{display:grid;gap:12px;margin-top:10px}
.book h3{margin:4px 0 0;font-size:11px;letter-spacing:.24em;font-weight:600}
.book h3[data-tier="1"]{color:var(--silver)}.book h3[data-tier="2"]{color:var(--gold-hi)}.book h3[data-tier="3"]{background:var(--nacre);-webkit-background-clip:text;background-clip:text;color:transparent}
.book ul{list-style:none;margin:0;padding:0;display:grid;gap:9px}
.book li{display:grid;grid-template-columns:24px minmax(0,1fr);column-gap:10px;align-items:start}
.book li .seal{grid-row:span 2;margin-top:2px}
.book li b{font-size:13px;font-weight:600;color:var(--ivory)}
.book li b small{font-weight:400;color:var(--gold);font-size:11.5px;margin-left:6px}
.book li span{color:var(--muted);font-size:12px;line-height:1.5}
.bal-wrap{overflow-x:auto;margin-top:8px}
.bal{width:100%;border-collapse:collapse;font-size:12.5px;font-variant-numeric:tabular-nums}
.bal th{font-weight:500;color:var(--faint);font-size:11px;letter-spacing:.06em;text-align:left;padding:4px 6px;border-bottom:1px solid var(--hair)}
.bal td{padding:5px 6px;border-bottom:1px solid rgba(201,164,92,.1);white-space:nowrap}
.bal .num{text-align:right}
.bal .dim{color:var(--muted);font-size:11.5px}
.bal .grp td{padding-top:12px;color:var(--gold);font-size:11px;letter-spacing:.16em;border-bottom:1px solid var(--hair)}
.bal .bar{display:inline-block;height:6px;border-radius:1px;background:var(--gold-leaf);vertical-align:middle}
.bal .bar.neg{background:#6d5a4a}

.overlay{position:fixed;inset:0;z-index:20;background:var(--scrim);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:grid;place-items:center;overflow-y:auto;
  padding:max(20px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(20px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
#ovMenu{z-index:30}
.ov-card{position:relative;background:linear-gradient(180deg,#1e1915,#141110);border:1px solid var(--hair-strong);border-radius:4px;padding:30px;width:min(100%,740px);box-sizing:border-box;box-shadow:0 40px 90px rgba(0,0,0,.6)}
.ov-card::before{content:"";position:absolute;inset:6px;border:1px solid var(--hair);border-radius:2px;pointer-events:none}
.eyebrow{margin:0;font-size:11.5px;letter-spacing:.24em;color:var(--gold)}
.menu{width:min(100%,600px)}
#ovProfile{z-index:40}
#ovBook{z-index:40}
#ovTut,#ovIntro{z-index:45}
.mini-card{width:min(100%,420px);text-align:center}
.mini-card h2{margin:4px 0 10px;font-family:var(--font-display);font-size:24px}
.mini-cv{display:block;width:min(100%,300px);aspect-ratio:1;margin:0 auto;border-radius:10px;border:1px solid var(--hair)}
.mini-text{margin:12px 0 0;min-height:4.4em;color:var(--ivory);font-size:14px;line-height:1.6}
.mini-list{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:6px;text-align:left;font-size:13.5px;color:var(--faint)}
.mini-list li{padding-left:16px;position:relative;transition:color .3s}

/* 골드·프리즘 증강이 나오기 직전의 등장 연출 (실버는 그대로) */
.reveal{position:fixed;inset:0;z-index:26;display:grid;place-items:center;overflow:hidden;cursor:pointer;pointer-events:auto}
.reveal>*{position:absolute;pointer-events:none}
.reveal.out{animation:rv-out .38s ease-in forwards}
.rv-burst{width:150vmax;height:150vmax;border-radius:50%;animation:rv-burst var(--t,1.1s) cubic-bezier(.1,.8,.3,1) forwards}
.rv-rays{width:170vmax;height:170vmax;-webkit-mask-image:radial-gradient(circle,#000 0%,rgba(0,0,0,.6) 30%,transparent 62%);mask-image:radial-gradient(circle,#000 0%,rgba(0,0,0,.6) 30%,transparent 62%);animation:rv-spin var(--spin,3s) linear forwards,rv-raysin .5s ease-out both}
.rv-title{position:relative!important;font-family:var(--font-display);font-weight:900;font-size:clamp(44px,11vw,96px);letter-spacing:.18em;line-height:1;text-align:center;-webkit-background-clip:text;background-clip:text;color:transparent;animation:rv-title .9s cubic-bezier(.2,1.5,.35,1) both}
.rv-title small{display:block;font-size:.26em;letter-spacing:.5em;margin-top:.5em;font-weight:700}
.rv-p{left:50%;top:50%;width:var(--w,10px);height:var(--h,14px);border-radius:1px;animation:rv-fly var(--d,1s) cubic-bezier(.15,.7,.3,1) var(--dl,0s) both}
.rv-ring{left:50%;top:50%;width:20vmax;height:20vmax;margin:-10vmax 0 0 -10vmax;border-radius:50%;animation:rv-ring var(--d,1.2s) cubic-bezier(.1,.7,.3,1) var(--dl,0s) both}
.rv-flash{inset:0;background:#fff;animation:rv-flash .55s ease-out both}
/* 골드: 금빛 폭발, 회전하는 빛살, 흩날리는 금박 */
.reveal[data-tier="1"]{background:radial-gradient(circle at 50% 50%,rgba(24,26,30,.5),rgba(6,6,8,.82))}
.reveal[data-tier="1"] .rv-burst{background:radial-gradient(circle,rgba(250,252,255,.85) 0%,rgba(201,206,214,.5) 10%,rgba(160,168,180,.18) 28%,transparent 52%)}
.reveal[data-tier="1"] .rv-rays{background:repeating-conic-gradient(from 0deg,rgba(230,236,245,0) 0deg 10deg,rgba(230,236,245,.28) 10deg 12deg,rgba(230,236,245,0) 12deg 30deg)}
.reveal[data-tier="1"] .rv-title{background-image:linear-gradient(180deg,#ffffff 0%,#dfe4ea 45%,#9aa1ab 70%,#f6f8fb 100%);-webkit-text-stroke:1.2px rgba(40,44,52,.9);filter:drop-shadow(0 0 3px rgba(0,0,0,.9)) drop-shadow(0 0 18px rgba(220,228,240,.7))}
.reveal[data-tier="1"] .rv-title small{color:#dfe4ea;-webkit-text-stroke:0;-webkit-background-clip:border-box;background:none}
.reveal[data-tier="1"] .rv-p{background:var(--silver-leaf);box-shadow:0 0 5px rgba(230,236,245,.7)}
.reveal[data-tier="1"] .rv-ring{border:2px solid rgba(230,236,245,.85);box-shadow:0 0 16px rgba(220,228,240,.6)}
.reveal[data-tier="2"]{background:radial-gradient(circle at 50% 50%,rgba(40,26,8,.55),rgba(8,6,4,.86))}
.reveal[data-tier="2"] .rv-burst{background:radial-gradient(circle,rgba(255,240,190,.95) 0%,rgba(240,200,110,.7) 10%,rgba(201,164,92,.28) 30%,transparent 58%)}
.reveal[data-tier="2"] .rv-rays{background:repeating-conic-gradient(from 0deg,rgba(255,226,150,0) 0deg 8deg,rgba(255,226,150,.42) 8deg 11deg,rgba(255,226,150,0) 11deg 22.5deg)}
.reveal[data-tier="2"] .rv-title{background-image:linear-gradient(180deg,#fff8d8 0%,#f6d98a 40%,#e0b050 62%,#fff0b8 100%);-webkit-text-stroke:1.5px rgba(70,42,8,.9);filter:drop-shadow(0 0 3px rgba(20,10,0,.9)) drop-shadow(0 0 26px rgba(255,200,100,.9)) drop-shadow(0 6px 0 rgba(40,24,6,.85))}
.reveal[data-tier="2"] .rv-title small{color:#f1dca6;-webkit-text-stroke:0;-webkit-background-clip:border-box;background:none}
.reveal[data-tier="2"] .rv-p{background:var(--gold-leaf);box-shadow:0 0 6px rgba(255,214,120,.8)}

/* 프리즘: 흰 섬광, 무지갯빛 빛살·고리·파편, 반짝이는 별 */
.reveal[data-tier="3"]{background:radial-gradient(circle at 50% 50%,rgba(26,18,44,.7),rgba(4,3,8,.94))}
.reveal[data-tier="3"] .rv-burst{background:radial-gradient(circle,rgba(255,255,255,.95) 0%,rgba(214,201,242,.6) 8%,rgba(191,227,234,.32) 18%,rgba(242,207,224,.16) 30%,transparent 52%);animation-duration:1.6s}
.reveal[data-tier="3"] .rv-rays{background:repeating-conic-gradient(from 0deg,#bfe3ea 0deg 4deg,transparent 4deg 10deg,#d6c9f2 10deg 14deg,transparent 14deg 20deg,#f2cfe0 20deg 24deg,transparent 24deg 30deg,#f1e2bd 30deg 34deg,transparent 34deg 40deg,#c7ebdd 40deg 44deg,transparent 44deg 50deg);opacity:.55;animation:rv-spin 4s linear forwards,rv-raysin .5s ease-out both,rv-hue 2s linear infinite}
.reveal[data-tier="3"] .rv-rays.b{animation-direction:reverse,normal,normal;opacity:.45;width:130vmax;height:130vmax}
.reveal[data-tier="3"] .rv-title{background-image:linear-gradient(100deg,#8fd6e4,#b9a6f2,#f2a9cb,#f1d38f,#9fe3c4,#8fd6e4,#b9a6f2);background-size:300% 100%;-webkit-text-stroke:1.5px rgba(255,255,255,.95);animation:rv-title .9s cubic-bezier(.2,1.5,.35,1) both,rv-sheen 1.4s linear infinite;filter:drop-shadow(0 0 3px rgba(10,6,24,.95)) drop-shadow(0 0 18px rgba(255,255,255,.75)) drop-shadow(0 0 44px rgba(185,166,242,.95))}
.reveal[data-tier="3"] .rv-title small{color:#fff;-webkit-text-stroke:0;-webkit-background-clip:border-box;background:none;text-shadow:0 0 12px #b9a6f2}
.reveal[data-tier="3"] .rv-p{background:var(--nacre);clip-path:polygon(50% 0,100% 100%,0 100%);mix-blend-mode:screen;filter:drop-shadow(0 0 4px #fff)}
.reveal[data-tier="3"] .rv-p.star{clip-path:polygon(50% 0,61% 39%,100% 50%,61% 61%,50% 100%,39% 61%,0 50%,39% 39%);background:#fff}
.reveal[data-tier="3"] .rv-ring{background:conic-gradient(#bfe3ea,#d6c9f2,#f2cfe0,#f1e2bd,#c7ebdd,#bfe3ea);-webkit-mask:radial-gradient(circle,transparent 60%,#000 62%,#000 68%,transparent 70%);mask:radial-gradient(circle,transparent 60%,#000 62%,#000 68%,transparent 70%);filter:drop-shadow(0 0 10px #fff)}
@keyframes rv-burst{0%{transform:scale(0);opacity:1}35%{opacity:1}100%{transform:scale(1);opacity:.22}}

@keyframes rv-raysin{from{opacity:0;scale:.4}}
@keyframes rv-hue{to{filter:hue-rotate(360deg)}}
@keyframes rv-title{0%{transform:scale(2.6);opacity:0;letter-spacing:.6em}60%{opacity:1}100%{transform:scale(1);opacity:1}}
@keyframes rv-sheen{to{background-position:-300% 0}}
@keyframes rv-fly{0%{transform:translate(-50%,-50%) rotate(0) scale(.4);opacity:0}12%{opacity:1}100%{transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) rotate(var(--r)) scale(1);opacity:0}}
@keyframes rv-ring{0%{transform:scale(.1);opacity:1}100%{transform:scale(var(--s,6));opacity:0}}

/* 연출 뒤 카드가 한 장씩 뒤집혀 놓입니다 */

<script>
const CORE = (() => {
'use strict';

/* ===== board ===== */
const N = 19, GAP = 75.67, INSET = 46, S = INSET * 2 + GAP * (N - 1);
const BASE_R = GAP * 0.45, DT = 1 / 240, DT0 = DT, PLAN_DT = 1 / 120, FALL_T = 0.42, TAU = Math.PI * 2, R2 = Math.SQRT1_2;
const CX = S / 2, CY = S / 2;
const L = i => INSET + i * GAP;

/* physics + rules (tunable) */
const P = {
  maxSpeed: 1720, decel: 700, drag: 1.1, rest: 0.92, wallRest: 0.72, bumpRest: 1.0, bumpKick: 160,
  padMult: 1.7, padAdd: 900, padMaxV: 2600, padCool: 5, padStart: 3, rockHits: 3, rockMinV: 150, shrinkStart: 30, shrinkStep: GAP * 0.5, tengenR: 90, timeout: 16, lossPerPick: 3, lastKB: 0.35, pityAfter: 3
};
/* augment numbers (tunable) */
const A = {
  ironM: 1.0863, sizeN: 2, bigR: 1.25, bigM: 1.12, denseR: 0.72, denseM: 1.0, denseV: 1.28, fast: 1.055, massK: 0.5, reinforce: 1,
  shaky: 0.101, seal: 2, root: 1.15, aimNoise: 0.5194, shackle: 0.9333,
  bombR: 170, bombF: 1100, bombBase: 240, oil: 0.8458, markD: 4 * GAP, markK: 1.32, combo: 1, comboRound: 2,
  wedgeM: 1.25, splitImpact: 640, splitR: 0.8, splitM: 0.7, splitV: 0.7, splitN: 2, wallSave: 1,
  pierce: 1.0, thorns: 0.3, traps: 2, trapR: 27, doubleV: 0.66,
  revive: 2, buddy: 1, thief: 1, rewind: 3, kingR: 1.5, kingM: 1.5, kingV: 1.1, boltEvery: 2, boltV: 680,
  clone: 1, cloneK: 1.0, buddyD: 500, lastN: 3, lastR: 1.15, lastM: 1.3, lastV: 1.05, tideD: GAP
};
/* tier odds per pick: [silver, gold, prism]; always silver > gold > prism, a little richer on later picks */
const TIER_ODDS = [[60, 30, 10], [50, 33, 17], [45, 35, 20]];

const diamond = (cx, cy, h) => ({ kind: 'diamond', cx, cy, h, hs: h * R2 });
const MAPS = {
  flat: { id: 'flat', name: '평야', short: '거칠 것 없는 맨판에서 실력으로 겨룹니다', obs: [], shrinkMax: CX - 1.5 * GAP },
  diamond: { id: 'diamond', name: '흑요석 제단', short: '가운데 마름모 바위가 돌을 튕겨 내고, 세 번 맞으면 깨집니다', noTengen: true,
    obs: [Object.assign(diamond(CX, CY, 3 * GAP), { breakAt: 3 })], shrinkMax: CX - 1.5 * GAP, crumbleAt: 4.2 * GAP },
  siege: { id: 'siege', name: '철옹성', short: '양 진영 뒤를 성벽이 막고, 성벽도 돌을 튕겨 냅니다', shrinkMax: CX - 1.5 * GAP, obs: [
    { kind: 'wall', side: 'top', x0: L(2), x1: L(16), y0: -80, y1: 18 },
    { kind: 'wall', side: 'bottom', x0: L(2), x1: L(16), y0: S - 18, y1: S + 80 }] }
};
/* 용오름: 판 한가운데를 가로지르는 바람길. 지나는 돌을 밀어 주고, 한 번 쓰이면 몇 수 뒤 다시 생깁니다 */
MAPS.boost = { id: 'boost', name: '용오름', short: '가운데 바람길은 3수 뒤 열리고, 지나는 돌을 빠르게 합니다. 쓰이면 5수 뒤 다시 열립니다',
  obs: [], pads: [{ kind: 'band', x: CX, y: CY, x0: INSET - 0.5 * GAP, x1: S - INSET + 0.5 * GAP, h: 0.32 * GAP }], shrinkMax: CX - 1.5 * GAP };
const MAP_IDS = ['flat', 'diamond', 'siege', 'boost'];
for (const m of MAP_IDS) MAPS[m].obs.forEach((o, i) => { o.oi = i; });

/* rows counted from the team's own back edge side: black uses rows as-is (bottom), white mirrors */
const FORMATION = {
  '1v1': {
    base: [[[15, 3], [15, 7], [15, 11], [15, 15], [16, 5], [16, 9], [16, 13]]],
    extra: [[17, 9], [17, 7], [17, 11], [17, 3], [17, 15]]
  },
  '2v2': {
    base: [[[15, 3], [15, 11], [16, 13], [17, 7]], [[15, 15], [15, 7], [16, 5], [17, 11]]],
    extra: [[16, 9], [17, 3], [17, 15], [17, 9]]
  }
};

const pct = x => Math.round(x * 100);
/* 화면에 보이는 배수는 깔끔하게: 소수 둘째 자리에서 반올림하고 뒤의 0은 뺌 (1.4993 → 1.5, 1.25 → 1.25) */
const f1 = x => Math.round(x * 100) / 100;
const deg = x => Math.round(x * 180 / Math.PI);
const AUG = {
  /* ---- silver ---- */
  iron:      { name: '쇳덩이', seal: '鐵', tier: 1, max: 3, short: () => `무게 +${pct(A.ironM - 1)}%`,
    desc: () => `내 돌이 모두 ${pct(A.ironM - 1)}% 무거워집니다. 맞아도 잘 밀리지 않고 더 묵직하게 밀어내지만, 그만큼 덜 나갑니다.` },
  big:       { name: '큰 돌', seal: '巨', tier: 1, max: 1, short: () => `돌 ${A.sizeN}개 크기 +${pct(A.bigR - 1)}% · 무게 ×${f1(A.bigM)}`,
    desc: () => `판 가운데에 가까운 내 돌 ${A.sizeN}개가 ${pct(A.bigR - 1)}% 커지고 무게가 ${f1(A.bigM)}배가 됩니다. 잘 밀려나지 않고, 부딪힐 때 상대를 훨씬 세게 밀어냅니다. 샷 힘은 그대로입니다.` },
  dense:     { name: '차돌', seal: '小', tier: 1, max: 1, short: () => `돌 ${A.sizeN}개 크기 −${pct(1 - A.denseR)}% · 샷 힘 +${pct(A.denseV - 1)}%`,
    desc: () => `판 가운데에 가까운 내 돌 ${A.sizeN}개가 ${pct(1 - A.denseR)}% 작아지고, 그 돌의 샷 힘이 ${pct(A.denseV - 1)}% 세집니다. 맞히기 어렵고 더 빠르게 멀리 나갑니다.` },
  fast:      { name: '강속구', seal: '速', tier: 1, max: 2, short: () => `최대 힘 +${pct(A.fast - 1)}%`,
    desc: () => `내 샷의 최대 힘이 ${pct(A.fast - 1)}% 세집니다. 작은 차이 같아도 사거리 싸움에서는 한발 먼저 닿습니다.` },
  reinforce: { name: '증원', seal: '援', tier: 1, max: 3, short: () => `돌 +${A.reinforce}`,
    desc: () => `고르는 즉시 우리 진영에 내 돌이 ${A.reinforce}개 더 놓입니다.` },
  shaky:     { name: '손떨림', seal: '震', tier: 1, max: 1, short: () => '상대 조준 흔들기',
    desc: () => `상대가 조준하는 동안 화살표가 짧아지고 흔들립니다. 실제 샷도 최대 ${deg(A.shaky / 2)}°까지 빗나갑니다.` },
  seal:      { name: '봉인', seal: '封', tier: 1, max: 2, short: () => `상대 돌 ${A.seal}개 봉인`,
    desc: () => `고르는 즉시 상대 돌 ${A.seal}개를 봉인합니다. 봉인된 돌은 이번 국 동안 쏠 수 없습니다.` },
  root:      { name: '뿌리', seal: '根', tier: 1, max: 2, short: () => `버틸 때 무게 +${pct(A.root - 1)}%`,
    desc: () => `상대가 칠 때만 내 돌이 ${pct(A.root - 1)}% 무거워집니다. 버티는 힘만 세지고 내 샷은 그대로입니다.` },
  aim:       { name: '정조준', seal: '準', tier: 1, max: 1, short: () => '첫 충돌까지 궤적 표시',
    desc: () => '조준할 때 내 돌이 처음 부딪히는 곳까지의 궤적과, 맞은 돌이 날아갈 방향을 보여 줍니다.' },
  shackle:   { name: '족쇄', seal: '鎖', tier: 1, max: 2, short: () => `상대 최대 힘 −${pct(1 - A.shackle)}%`,
    desc: () => `상대 샷의 최대 힘이 ${pct(1 - A.shackle)}% 약해집니다. 상대 사거리가 그만큼 짧아집니다.` },
  /* ---- gold ---- */
  combo:     { name: '연타', seal: '連', tier: 2, max: 1, short: () => `떨어뜨리면 한 번 더 (${A.comboRound}회)`,
    desc: () => `내 샷으로 상대 돌을 떨어뜨리면 한 번 더 칩니다. 한 차례에 한 번, 이번 국에 ${A.comboRound}번까지 됩니다.` },
  bomb:      { name: '시한폭탄', seal: '爆', tier: 2, max: 1, short: () => '쏜 돌이 멈추면 폭발',
    desc: () => '내가 쏜 돌이 멈추는 순간 터지면서 주변 돌을 모두 밀어냅니다. 내 돌도 예외는 아닙니다.' },
  marks:     { name: '명사수', seal: '射', tier: 2, max: 1, short: () => `${Math.round(A.markD / GAP)}칸 넘게 날아가 맞히면 +${pct(A.markK - 1)}%`,
    desc: () => `내가 쏜 돌이 출발한 자리에서 ${Math.round(A.markD / GAP)}칸 넘게 날아가 상대 돌을 맞히면, 맞은 돌이 ${pct(A.markK - 1)}% 더 세게 튕겨 나갑니다. 멀리서 노릴수록 강해집니다.` },
  wedge:     { name: '쐐기', seal: '楔', tier: 2, max: 1, short: () => `쏜 돌이 멈추면 무게 ×${f1(A.wedgeM)}`,
    desc: () => `내가 쏜 돌이 멈춘 자리에 쐐기처럼 박혀, 다음 내 차례가 올 때까지 무게가 ${f1(A.wedgeM)}배가 됩니다. 어디에 세울지는 내가 정하고, 상대는 그 돌을 쉽게 밀어내지 못합니다.` },
  wall:      { name: '철벽', seal: '壁', tier: 2, max: 1, team: true, short: () => '우리 돌만 막는 뒤쪽 벽',
    desc: () => `우리 진영 뒤 가장자리에 우리 돌만 막아 주는 고무벽이 생깁니다. 판이 줄어들면 벽도 따라 들어오고, 국마다 ${A.wallSave}번까지 밀려난 돌을 안으로 되돌려 줍니다.` },
  split:     { name: '분열', seal: '分', tier: 2, max: 1, short: () => `세게 맞으면 둘로 (${A.splitN}회)`,
    desc: () => `내 돌이 상대 돌에 세게 맞으면 작은 돌 두 개로 갈라집니다. 이번 국에 ${A.splitN}번까지 일어납니다.` },
  pierce:    { name: '굳건', seal: '堅', tier: 2, max: 1, short: () => `첫 타격에 힘을 모두 실음 · 내 돌은 그 자리에`,
    desc: () => `내가 쏜 돌이 처음 맞힌 상대 돌에 힘을 모두 실어 보냅니다. ${A.pierce > 1 ? `맞은 돌은 ${pct(A.pierce - 1)}% 더 빠르게 날아가고, ` : ''}내 돌은 그 자리에 굳건히 멈춥니다.` },
  thorns:    { name: '가시', seal: '棘', tier: 2, max: 1, short: () => '나를 친 돌을 튕겨 냄',
    desc: () => `상대 샷에서 내 돌과 부딪힌 상대 돌은 부딪힌 세기의 ${pct(A.thorns)}%만큼 더 튕겨 나갑니다.` },
  trap:      { name: '함정', seal: '陷', tier: 2, max: 2, short: () => `상대 진영 앞 숨은 함정 ${A.traps}개`,
    desc: () => `고르는 즉시 상대 진영 앞에 함정 ${A.traps}개를 팝니다. 판이 줄어드는 후반에 고르면 판 가운데 가까이 팝니다. 상대 눈에는 보이지 않고, 상대 돌만 빠집니다. 빠진 돌은 탈락하고 그 함정은 드러납니다.` },
  double:    { name: '쌍발', seal: '雙', tier: 2, max: 1, short: () => `같은 돌로 2번 · 최대 힘 −${pct(1 - A.doubleV)}%`,
    desc: () => `매 차례 두 번씩 칩니다. 두 번째는 첫 번째로 친 돌로만 칠 수 있고, 내 샷의 최대 힘이 ${pct(1 - A.doubleV)}% 약해집니다.` },
  /* ---- prism ---- */

let AC = null, NOISE = null, muted = false, lastHitT = 0;
function ensureAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }

}
function wood(freq = 820, vol = 0.32) {
  if (!AC || muted) return;
  const t = AC.currentTime, o = AC.createOscillator(), g = AC.createGain();
  o.type = 'triangle'; o.frequency.setValueAtTime(freq, t); o.frequency.exponentialRampToValueAtTime(freq * 0.68, t + 0.1);
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.16);

}

  if (!AC || muted) return;

    const o = AC.createOscillator(), g = AC.createGain();
    o.type = 'sine'; o.frequency.value = freq * m;

    g.gain.exponentialRampToValueAtTime(0.0001, t + dur / (1 + i * 0.7));

}

  const bp = AC.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = freq; bp.Q.value = 5;
  const g = AC.createGain();
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  src.connect(bp); bp.connect(g); g.connect(AC.destination);
  src.start(t); src.stop(t + dur + 0.02);
}

}

/* ---------- loop ---------- */
let lastT = performance.now(), acc = 0;
function frame(now) {
  const dt = Math.min(0.05, (now - lastT) / 1000);
  lastT = now;
  const w = G.world;
  if (G.state === 'moving' && w && w.shot) {
    acc += dt;
    let n = 0;
    while (acc >= K.DT && n < 40) {
      K.step(w); K.updatePhase(w); acc -= K.DT; n++;
      if (w.shot.phase === 'done') break;
    }
    drainEvents();
    if (w.shot.phase === 'done') { acc = 0; G.state = 'settle'; endShot(); }
  } else if (G.state === 'replay' && w && w.shot) {
    acc += dt;
    let n = 0;
    while (acc >= K.DT && n < 40) { K.step(w); K.updatePhase(w); acc -= K.DT; n++; if (w.shot.phase === 'done') break; }
    drainEvents();
    if (w.shot.phase === 'done') { acc = 0; G.state = 'remote'; netAfterReplay(); }
  } else {
    drainEvents();
  }
  if (G.cpuAnim && G.state === 'aim' && now - G.cpuAnim.t0 > 800) {
    const c = G.cpuAnim; G.cpuAnim = null; fire(G.current, c.id, c.ang, c.pw);
  }
  for (const k in G.bumpGlow) { G.bumpGlow[k] = Math.max(0, G.bumpGlow[k] - dt * 3); }
  if (G.padGlow > 0) G.padGlow = Math.max(0, G.padGlow - dt * 2);
  for (const t of [0, 1]) { G.wallGlow[t] = Math.max(0, G.wallGlow[t] - dt * 1.6); if (G.wallRise[t] < 1) G.wallRise[t] = Math.min(1, G.wallRise[t] + dt * 1.4); }
  if (G.padBack > 0) G.padBack = Math.max(0, G.padBack - dt * 1.1);
  for (const f of G.fx) f.a += dt;
  G.fx = G.fx.filter(f => f.a < f.life);
  if (G.shake > 0) G.shake = Math.max(0, G.shake - dt);
  if (G.hintFlash > 0) { G.hintFlash -= dt; if (G.hintFlash <= 0) renderStrip(); }
  render(now);
  requestAnimationFrame(frame);
}

function toWorld(e) {

let tutIdx = 0, miniStop = null;
function miniRun(cv, scene, onEnd, loop = true) {

  let t0 = performance.now(), raf = 0, ended = false;
  const frame = now => {
    let t = (now - t0) / 1000;
    if (reduceMotion) t = scene.d - 0.01;
    if (t >= scene.d) { if (onEnd && !ended) { ended = true; onEnd(); } if (loop && !reduceMotion) { t0 = now; t = 0; } else t = scene.d - 0.01; }
    g.setTransform(dpr, 0, 0, dpr, 0, 0);
    scene.draw(g, t);
    if (scene.tick) scene.tick(t);
    raf = requestAnimationFrame(frame);
  };
  raf = requestAnimationFrame(frame);
  miniStop = () => { cancelAnimationFrame(raf); miniStop = null; };
}
