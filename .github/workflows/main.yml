name: Keep Render awake
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" https://jeunggang-alggagi.onrender.com/)
          echo "HTTP $code"
          [ "$code" = "200" ] || exit 1
